name: 构建检查

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 检查平台选择
        run: gradle checkPackagingPlatforms printPackagingPlatform
      - name: 安装前端依赖
        run: gradle webInstall
      - name: 后端测试
        run: gradle test
      - name: 前端构建
        run: gradle webBuild
      - name: 提取工具测试
        run: node --test tools/extract-catalog.test.mjs
