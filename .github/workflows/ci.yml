name: 构建检查

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            run_tests: true
          - os: windows-latest
            run_tests: false
          - os: macos-latest
            run_tests: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 检查平台选择
        run: gradle checkPackagingPlatforms printPackagingPlatform
      - name: 检查 Unix 启动入口
        if: runner.os != 'Windows'
        shell: sh
        run: |
          for script in gradlew start-protolens.sh collect-protolens.sh; do
            sh -n "$script"
          done
          node --experimental-strip-types --test tools/startup-scripts.test.mjs tools/extract-catalog.test.mjs
      - name: 安装前端依赖
        run: gradle webInstall
      - name: 后端测试
        if: matrix.run_tests
        shell: bash
        run: |
          for attempt in 1 2 3; do
            gradle --no-daemon --max-workers=2 test && exit 0
            echo "后端测试第 ${attempt} 次失败，准备重试"
          done
          exit 1
      - name: 其他平台编译检查
        if: matrix.run_tests == false
        run: gradle compileJava compileTestJava
      - name: 前端构建
        run: gradle webBuild
      - name: 协议提取与工作台交互测试
        if: matrix.run_tests
        run: node --experimental-strip-types --test tools/*.test.mjs
