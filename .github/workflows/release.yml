name: 发布 ProtoLens

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: protolens-release-v2
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            installer: exe
            tasks: packageInstaller packagePortable
          - os: macos-latest
            platform: macos-arm64
            installer: tar.gz
            tasks: packagePortable
          - os: ubuntu-latest
            platform: linux-x64
            installer: tar.gz
            tasks: packagePortable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 准备 macOS 采集器
        if: matrix.platform == 'macos-arm64'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/protolens-mitm"
          curl -fsSL https://downloads.mitmproxy.org/12.3.1/mitmproxy-12.3.1-macos-arm64.tar.gz -o "$RUNNER_TEMP/mitmproxy.tar.gz"
          echo "9b7f7a8e3fd1b1544089c937c579ef1f0f503f0ea598c25bda9eab077c735b93  $RUNNER_TEMP/mitmproxy.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/mitmproxy.tar.gz" -C "$RUNNER_TEMP/protolens-mitm"
          echo "MITMDUMP_PATH=$(find "$RUNNER_TEMP/protolens-mitm" -type f -name mitmdump | head -1)" >> "$GITHUB_ENV"
      - name: 构建安装包和便携包
        if: matrix.platform != 'macos-arm64'
        run: gradle ${{ matrix.tasks }}
      - name: 构建 macOS 便携包
        if: matrix.platform == 'macos-arm64'
        run: gradle ${{ matrix.tasks }} "-PanalyzerMitmdumpExecutable=$MITMDUMP_PATH"
      - name: 上传发布产物
        uses: actions/upload-artifact@v4
        with:
          name: protolens-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/${{ matrix.platform }}/ProtoLens-latest.${{ matrix.installer }}
            release/ProtoLens-latest.exe
            build/distributions/ProtoLens-*.zip
            build/distributions/ProtoLens-*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: protolens-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/**/*
